    const it = makeImage(src, pick.title || query);
    it.el.classList.add('webcard');
    it.def.fx = 0;
    it.def.vid = 0;
    it.x = innerWidth * 0.50;
    it.y = innerHeight * 0.42;
    it.el.style.opacity = '1';
    const im = it.el.querySelector('img');
    if (im) {
      im.onload = () => {
        it.el.style.opacity = '1';
      };
      im.onerror = () => toast('JARVIS found the image, but it could not load it.', 2200);
    }
    items.push(it);
    return true;
  } catch (err) {
    console.error('JARVIS image:', err);
    toast('JARVIS image search failed.', 1800);
    return false;
  }
}

function startJarvisListening() {
  if (JARVIS_VOICE.active || JARVIS_VOICE.processing) return;
  if (!JARVIS_VOICE.recognition) JARVIS_VOICE.recognition = jarvisRecognition();
  if (!JARVIS_VOICE.recognition) {
    toast('Chrome speech recognition is not available.', 2200);
    return;
  }
  try { JARVIS_VOICE.recognition.start(); }
  catch (_) {}
}

addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.key.toLowerCase() === 'v') {
    e.preventDefault();
    startJarvisListening();
  }
});

function toScreen(lm) {
  const vw = cam.videoWidth, vh = cam.videoHeight;
  const scale = Math.max(innerWidth / vw, innerHeight / vh);
  const dw = vw * scale, dh = vh * scale;
  const ox = (innerWidth - dw) / 2, oy = (innerHeight - dh) / 2;
  return { x: ox + (1 - lm.x) * dw, y: oy + lm.y * dh };
}

let lastClearT = 0, lastResetT = 0;   // clear/reset cooldowns (wipe + clap)
const clap = { hist: [] };            // inter-hand distance samples (v3)

function getCursor(i) {
  if (!cursors[i]) {
    const el = document.createElement("div");
    el.className = "cursor";
    el.innerHTML = `<div class="dwell" style="--p:0"></div>`;
    document.body.appendChild(el);
    cursors[i] = { el, ring: el.querySelector(".dwell"), x: innerWidth / 2,
                   y: innerHeight / 2, pinched: false, history: [],
                   palmOpen: false, softOpen: false, lastOpenT: 0,
                   lastSoftT: 0, wipe: null,
                   pinchT: 0, ghost: false };
  }
  return cursors[i];
}

function dropCursor(i) {
  const cur = cursors[i];
  if (!cur) return;
  items.forEach(c => { const k = c.grabbedBy.indexOf(i); if (k >= 0) endGrab(c, i, cur); });
  cur.el.remove();
  delete cursors[i];
}

function hitTest(cur) {
  for (let i = items.length - 1; i >= 0; i--) {
    const c = items[i], r = c.el.getBoundingClientRect();
    if (cur.x > r.left - 24 && cur.x < r.right + 24 &&
        cur.y > r.top - 24 && cur.y < r.bottom + 24) return c;
  }
  return null;
}

// v13: zoneOf died — POINTING scrolls (a different hand shape), so a
// pinch ANYWHERE on anything is always grab/move/flick. No intent lock,
// no zones, no direction juries. The conflict didn't get solved; it got
// dissolved (Jared's design).

function beginGrab(c, i, cur) {
  c.flying = false;
  c.anim = null;                                     // a grab beats an animation
  c.grabbedBy.push(i);
  lastTouchedId = c.id;
  cur.grabT = performance.now();
  // FOLEY SCOPE (Jared's rule 2026-08-07): sound belongs to MOVING the
  // widgets — opened panels are silent territory (the scroll-thup disease)
  if (c.type !== "panel") foley.grab();
  c.el.classList.add("grabbed");
  BEHIND.appendChild(c.el);                   // bring to front
  if (c.grabbedBy.length === 1) {
    c.ox = c.x - cur.x; c.oy = c.y - cur.y;
    // v16 — JARED'S SPEC (design #7, his own): on a NOTE, pinch = SCROLL
    // by default (the day-one mechanics); holding the pinch ~2s roughly
    // still (80px tremor room, timer re-anchors on drift instead of
    // punishing) PROMOTES to move — the note glows and latches to the
    // hand. Cards move immediately as always.
    if (c.type === "orb") {
      // bloom orbs are pinned TAP targets (Phase 2): pinchable, a quick
      // release opens their pane, but they never move — transient furniture
      c.mode = "pinned";
      c.tapX = cur.x; c.tapY = cur.y;
    } else if (c.type === "panel" || c.type === "browser") {
      // v3.3/v3.8 (Jared: "I need a dedicated place I can grab...
      // make the same rules apply to notes"): THE GRIP BAR on notes
      // AND folder panes — pinch the title bar = immediate MOVE, no
      // scroll-hold wait; quick tap there = CLOSE (endGrab). Below
      // the bar = scroll (+ rows on folder panes).
      const barEl = c.el.querySelector(".bar");
      const barR = barEl && barEl.getBoundingClientRect();
      if (barR && cur.y >= barR.top && cur.y <= barR.bottom &&
          cur.x >= barR.left && cur.x <= barR.right) {
        c.mode = "move"; c.barGrab = true;
        c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      } else {
        c.mode = "scroll"; c.barGrab = false;
        c.scroll0 = c.scrollY || 0; c.grabY0 = cur.y;
        c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      }
      c.tapX = cur.x; c.tapY = cur.y;   // tap discrimination
    } else if (c.type === "model") {
      // Build 1.1 (Jared's field call 8/9: the 180×9px handle bar broke
      // the v9 no-small-targets law — 2px tall on a shelf mini). Pinch
      // = MOVE like any card; HOLD ~1s roughly still = latch into
      // SPIN-in-place (the note panel's promotion machinery, flipped).
      c.mode = "move";
      c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      c.tapX = cur.x; c.tapY = cur.y;   // v3.1: tap-close discrimination
    } else if (c.type === "widget") {
      // the ring: carried like a card; a quick tap blooms the orbs
      c.mode = "move";
      c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      c.tapX = cur.x; c.tapY = cur.y;   // ring-tap discrimination
    } else {
      // GLASS ERA: every movable item arms the hold-to-rotate timer
      c.mode = "move";
      c.holdX = cur.x; c.holdY = cur.y; c.holdT = performance.now();
      c.tapX = cur.x; c.tapY = cur.y;   // v3: card tap-open discrimination
    }
  } else if (c.grabbedBy.length === 2 && c.mode !== "pinned") {
    // v3 (Jared's ruling 2026-08-14): two hands = SCALE ONLY — the
    // twist-roll died with the vocabulary redesign ("leave 2 hands for
    // scaling"; one-hand latch owns all rotation)
    const a = cursors[c.grabbedBy[0]], b = cursors[c.grabbedBy[1]];
    c.stretch = { d0: Math.hypot(a.x - b.x, a.y - b.y), s0: c.scale };
    c.mode = "stretch";
  }
}

function endGrab(c, i, cur) {
  c.grabbedBy = c.grabbedBy.filter(k => k !== i);
  if (c.grabbedBy.length === 1) {
    c.stretch = null;
    const rem = cursors[c.grabbedBy[0]];
    if (rem) { c.ox = c.x - rem.x; c.oy = c.y - rem.y; c.mode = "move";
               c.holdX = rem.x; c.holdY = rem.y;
               c.holdT = performance.now(); }
  }
  if (c.grabbedBy.length === 0) {
    c.el.classList.remove("grabbed");
    c.stretch = null;
    const h = cur.history;
    c.hch = 0;                          // hold-charge / movable glow ends
    // shelf v3: a quick, near-still release on a browser row = the TAP
    // (folders unfold, notes open, props stage, widgets summon)
    if (c.type === "browser" && c.mode === "scroll") {
      const bMs = performance.now() - (cur.grabT || 0);
      const bTrav = Math.hypot(cur.x - (c.tapX || cur.x),
                               cur.y - (c.tapY || cur.y));
      if (bMs < 350 && bTrav < 24) browserTap(c, cur);
    }
    // v3.3/v3.8: a quick tap on the GRIP BAR closes — notes and
    // folder panes alike
    if ((c.type === "browser" || c.type === "panel") && c.barGrab &&
        !cur.probKill) {
      const gMs = performance.now() - (cur.grabT || 0);
      const gTrav = Math.hypot(cur.x - (c.tapX || cur.x),
                               cur.y - (c.tapY || cur.y));
      if (gMs < 350 && gTrav < 24) killItem(c);
      c.barGrab = false;
    }
    // GESTURE v3 (2026-08-14, Jared's spec — "make it a single pinch"):
    // THE TAP OPENS — a quick, near-still release on a file-card
    // unfurls its note. Same tap idiom rows and widget buttons already
    // use; the double flash is dead.
    const pullFresh = performance.now() - (c.pullT || 0) < 800 ||
                      cur.probKill;
    if (c.type === "card" && c.def.file && !pullFresh) {
      const tMs = performance.now() - (cur.grabT || 0);
      const tTrav = Math.hypot(cur.x - (c.tapX || cur.x),
                               cur.y - (c.tapY || cur.y));
      if (tMs < 300 && tTrav < 26) openPanel(c);
    }
    // GESTURE v3.1 (2026-08-14, the crush is DEAD — "that is happening
    // too naturally"): THE TAP IS SYMMETRIC — tap opens closed things,
    // tap CLOSES open things. Quick near-still release on a note,
    // image, or hologram = it recedes. Widgets/rows/orbs keep their own
    // tap meanings; a fresh force-pull catch can't be tap-killed.
    // v3.8: notes close at the BAR only (matching folders) — a body
    // tap can't kill a note mid-read; images/models keep tap-anywhere
    if ((c.type === "img" || c.type === "model")
        && !pullFresh && !c.flying) {
      const xMs = performance.now() - (cur.grabT || 0);
      const xTrav = Math.hypot(cur.x - (c.tapX || cur.x),
                               cur.y - (c.tapY || cur.y));
      if (xMs < 300 && xTrav < 26) killItem(c);
    }
    // PHASE 2 quick-tap releases: the RING toggles its orbital bloom;
    // an ORB grows into its browser pane (same discrimination gate as
    // the browser-row tap: short grip, near-zero travel)
    {
      const qMs = performance.now() - (cur.grabT || 0);
      const qTr = Math.hypot(cur.x - (c.tapX ?? cur.x),
                             cur.y - (c.tapY ?? cur.y));
      if (qMs < 350 && qTr < 24) {
        if (c.type === "widget" && c.def.w === "ring" &&
            c.mode === "move") {
          const sc = RINGS.get(c.id);
          if (sc) sc.tapT = Date.now() / 1000;   // the ring's tap pulse
          ringToggle(c);
        } else if (c.type === "orb") {
          openBrowser(c.def.orb, c.x, c.y);
        }
      }
    }
    let flung = false;
    // v19.1 (Jared's confirm): a fling needs a REAL grip. Motion blur
    // during a fast wave collapses the fingers into a phantom 1-3 frame
    // "pinch" that grabbed the note and released at wave velocity —
    // notes got yeeted off screen by a bare hand. Sub-120ms grips
    // release in place, no throw.
    const gripMs = performance.now() - (cur.grabT || 0);
    // stretch releases NEVER fling (Jared's catch 8/8: "it keeps
    // throwing it off the screen" — a two-hand rip ends with fast hand
    // motion, which read as a flick and yeeted the freshly-enlarged
    // prop). Any item stretched in the last 700ms sets down gently;
    // only a deliberate one-hand flick can throw.
    if (h.length >= 2 && gripMs >= 120 &&
        performance.now() - (c.stretchT || 0) > 700) {
      // v3.6 (the dead toss): endpoint velocity sampled the throw's
      // follow-through — use PEAK velocity across the last ~200ms
      // instead. Guard: the FINAL instant must still carry ≥40% of the
      // peak, so a fast drag that STOPS before release places gently.
      const tEnd = h[h.length - 1].t;
      let vx = 0, vy = 0, pk = 0;
      for (let k = 0; k + 1 < h.length; k++) {
        const a2 = h[k], b2 = h[Math.min(k + 2, h.length - 1)];
        if (a2.t < tEnd - 220 || b2.t <= a2.t) continue;
        const d2 = (b2.t - a2.t) / 1000;
        const x2 = (b2.x - a2.x) / d2, y2 = (b2.y - a2.y) / d2;
        const s2 = Math.hypot(x2, y2);
        if (s2 > pk) { pk = s2; vx = x2; vy = y2; }
      }
      const la = h[Math.max(0, h.length - 3)], lb = h[h.length - 1];
      const ldt = (lb.t - la.t) / 1000;
      const lastS = ldt > 0
        ? Math.hypot(lb.x - la.x, lb.y - la.y) / ldt : 0;
      // v3.9.16 (his correction: "I also like tossing things between
      // both hands back and forth" — the v3.9.14 exit-bound rule
      // killed mid-screen tosses and died within the hour; 1800 was
      // too sticky besides): the intent-teller is FOLLOW-THROUGH — a
      // real throw carries its speed INTO the release (≥50% of peak),
      // a drag's echoes have decayed by then. Speed bar at 1500,
      // thrown anywhere he likes — including hand to hand.
      {
        if (pk > 1300 && lastS > pk * 0.4) {   // v3.9.25: throw bar eased
          // v16: on a note in SCROLL mode only a clearly HORIZONTAL fling
          // closes (vertical fast releases are just energetic scrolling);
          // in promoted MOVE mode (and on cards) any fling tosses it.
          // (the v15 page-turn was removed — Jared rejected it.)
          // Build 1: a rotate-release NEVER flings the hologram — the
          // energy became spin momentum during the drag instead.
          if ((c.type === "model" && c.mode === "rotate") ||
              (c.type === "widget" && c.mode !== "move") ||
              c.mode === "pinned") {
            /* spin, not toss / taps, slides + pinned furniture never fling */
          } else if ((c.type !== "panel" && c.type !== "browser") ||
              c.mode !== "scroll" ||
              Math.abs(vx) > Math.abs(vy) * 1.2) {
            c.vx = vx; c.vy = vy; c.flying = true; flung = true;
          }
        }
      }
    }
    // foley: cards/images only (panels silent), and quick taps don't thup
    if (c.type !== "panel") {
      if (flung) foley.throw_();
      else if (performance.now() - (cur.grabT || 0) > 250) foley.place();
    }
  }
}

function killItem(c) {
  // graceful exit: recede into the screen (scale down + fade), then die —
  // the z-axis illusion (Jared's ask, v10). Replaces every instant remove.
  if (!c.el.isConnected || (c.anim && c.anim.k === "out")) return;
  c.grabbedBy = [];
  c.el.classList.remove("grabbed");
  c.flying = false;
  c.anim = { k: "out", t: 0 };
}

function physics(dt) {
  items = items.filter(c => c.el.isConnected || c.flying);
  // THE ORBITAL CONSTRAINT (round 5, Jared's law: the orbs keep a
  // CONSTANT clearance from the ring's EDGE wherever it is and
  // whatever size it is — satellites, riding moves + stretches live)
  const sun = items.find(i => i.type === "widget" &&
                              i.def.w === "ring" && i.el.isConnected);
  items.forEach(o => {
    if (o.type !== "orb" || !o.el.isConnected) return;
    if (!sun) { killItem(o); return; }       // no ring, no bloom
    const R = 200 * (sun.scale || 1) + 130;  // rim + gap + orb radius
    const tx = Math.min(innerWidth - 90, Math.max(90,
      sun.x + o.def.side * Math.cos(o.def.ang) * R));
    const ty = Math.min(innerHeight - 90, Math.max(90,
      sun.y + Math.sin(o.def.ang) * R));
    const k = Math.min(1, dt * 10);
    o.x += (tx - o.x) * k; o.y += (ty - o.y) * k;
  });
  // the spotlight ends itself: a grab or the item leaving the board
  if (presented && (!presented.el.isConnected || presented.grabbedBy.length))
    endPresent();
  items.forEach(c => {
    if (c.anim) {                     // the assistant's agency animations
      const a = c.anim; a.t += dt;
      if (a.k === "in") {             // THE MATERIALIZE (GLASS ERA):
        // born in place — back-ease bloom + a slight 3D turn-in,
        // the sci-fi materialize (replaces every edge-throw delivery)
        const p = Math.min(Math.max((a.t - (a.d || 0)) / 0.5, 0), 1);
        const c1 = 1.30158, c3 = c1 + 1;
        const e = 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2);
        c.inS = 0.5 + 0.5 * e;
        if (c.type !== "model") c.ry = -0.35 * (1 - e);
        c.el.style.opacity = String(0.05 + 0.95 * p);
        if (p >= 1) { c.anim = null; c.inS = 1; c.el.style.opacity = "";
                      if (c.type !== "model") c.ry = 0; }
      } else if (a.k === "out") {     // pushed OUT: recede + fade, then gone
        const p = Math.min(a.t / 0.35, 1);
        c.inS = 1 - 0.7 * p * p;
        c.el.style.opacity = String(1 - p);
        if (p >= 1) { c.el.remove(); c.anim = null; }
      } else if (a.k === "yank") {    // grip-fight shake, then ripped away
        if (a.t < 0.18) {
          c.jx = (Math.random() - 0.5) * 14; c.jy = (Math.random() - 0.5) * 14;
        } else {
          c.jx = c.jy = 0;
          c.x -= 2800 * dt;
          c.el.style.opacity = String(Math.max(0, 1 - (a.t - 0.18) / 0.45));
          if (c.x < -500) { c.el.remove(); c.anim = null; }
        }
      } else if (a.k === "hover") {   // attention pulse
        c.hch = 0.45 + 0.35 * Math.sin(a.t * 10);
        c.hs = 1 + 0.05 * Math.sin(a.t * 6);
        if (a.t > 2.2) { c.anim = null; c.hs = 1; c.hch = 0; }
      } else if (a.k === "present") { // THE PRESENT: fly to center stage
        const p = Math.min(a.t / 0.45, 1);   // and grow into the spotlight
        const e = 1 - Math.pow(1 - p, 3);
        c.x = a.x0 + (innerWidth * 0.5 - a.x0) * e;
        c.y = a.y0 + (innerHeight * 0.44 - a.y0) * e;
        c.scale = a.s0 + (a.s1 - a.s0) * e;
        c.el.style.opacity = "";
        if (p >= 1) c.anim = null;    // the spotlight classes hold until endPresent
      } else if (a.k === "give") {    // bloom in, then hand off to the
        const p = Math.min(a.t / 0.3, 1);            // pull flight — the
        const e = 1 - Math.pow(1 - p, 3);            // delivered-INTO-
        c.inS = 0.5 + 0.5 * e;                       // the-hand verb
        c.el.style.opacity = String(0.05 + 0.95 * p);
        if (c.type !== "model") c.ry = -0.35 * (1 - e);
        if (p >= 1) {
          if (c.type !== "model") c.ry = 0;
          c.el.style.opacity = "1";
          c.anim = cursors[a.ci]     // hand gone mid-bloom = stay at
            ? { k: "pull", t: 0, x0: c.x, y0: c.y, ci: a.ci }
            : null;                  // the reach (the offer fallback)
        }
      } else if (a.k === "pull") {    // THE FORCE PULL flight — ease-in
        const p = Math.min(a.t / 0.32, 1);
        const e = p * p;              // accelerates: ripped, not floated
        const cc = cursors[a.ci];
        const tx = cc ? cc.x : a.x0, ty = cc ? cc.y : a.y0;
        const ddx = tx - a.x0, ddy = ty - a.y0;
        const dd = Math.hypot(ddx, ddy) || 1;
        // a slight arc that dies at the hand
        const bow = Math.sin(Math.PI * p) * Math.min(90, dd * 0.12);
        c.x = a.x0 + ddx * e - (ddy / dd) * bow;
        c.y = a.y0 + ddy * e + (ddx / dd) * bow;
        if (p >= 1) {
          c.anim = null;
          const cc2 = cursors[a.ci];
          if (cc2) {                  // SMACK — caught, and HELD
            c.grabbedBy = [a.ci];
            c.pullT = performance.now();   // v3.1: tap guards skip a fresh catch
            c.mode = "move"; c.ox = 0; c.oy = 0;
            c.holdX = cc2.x; c.holdY = cc2.y;
            c.holdT = performance.now();
            cc2.grabT = performance.now();
            c.el.classList.add("grabbed");
            BEHIND.appendChild(c.el);
          }
          c.hch = 0;
        }
      } else if (a.k === "snap") {    // panel glides home after a page turn
        const p = Math.min(a.t / 0.3, 1), e = 1 - Math.pow(1 - p, 3);
        c.x = a.x0 + (a.x1 - a.x0) * e; c.y = a.y0 + (a.y1 - a.y0) * e;
        if (p >= 1) c.anim = null;
      }
    }
    if (c.sTarget != null && c.body) {  // smooth page glide
      c.scrollY = (c.scrollY || 0) + (c.sTarget - c.scrollY) * Math.min(1, dt * 8);
      if (Math.abs(c.sTarget - c.scrollY) < 1) { c.scrollY = c.sTarget; c.sTarget = null; }
      c.body.style.transform = `translateY(${-c.scrollY}px)`;
    }
    if (c.flying) {
      c.x += c.vx * dt; c.y += c.vy * dt;
      c.vx *= 0.98; c.vy *= 0.98;
      if (c.x < -600 || c.x > innerWidth + 600 ||
          c.y < -600 || c.y > innerHeight + 600) {
        c.el.style.opacity = "0"; c.flying = false;
        if (c.type !== "panel") foley.void_();
        setTimeout(() => c.el.remove(), 300);
      }
    }
    if (c.type === "model" && !(c.grabbedBy.length &&
        (c.mode === "rotate" || c.mode === "stretch"))) {
      // Build 1: spin momentum decays toward the stately idle turn —
      // a hologram that sits dead-still reads as a picture. (1.3: the
      // idle pauses during the gimbal grip too — it was creeping the
      // yaw while Jared held a precise two-hand pose.)
      c.rvy = (c.rvy || 0) * Math.pow(0.15, dt);
      c.ry = (c.ry || 0) + ((c.rvy || 0) + 0.12) * dt;
    }
    c.el.style.setProperty("--ch", c.hch || 0);   // hover charge glow
    const w = c.el.offsetWidth, h = c.el.offsetHeight;
    // GLASS ERA: items pose in real 3D (models rotate INSIDE their
    // three.js scene — their el stays flat, no double-spin)
    const r3 = c.type !== "model" && (c.rx || c.ry || c.rz)
      ? ` rotateX(${c.rx || 0}rad) rotateY(${c.ry || 0}rad) rotateZ(${c.rz || 0}rad)`
      : "";
    c.el.style.transform =
      `translate(${c.x - w / 2 + (c.jx || 0)}px, ${c.y - h / 2 + (c.jy || 0)}px)` +
      r3 + ` scale(${c.scale * (c.hs || 1) * (c.inS || 1)})`;
  });
}

async function boot() {
  await pickInitialCam();
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  landmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU" },
    numHands: 2, runningMode: "VIDEO",
    // phantom-hand filter (a real-room catch: debug showed a hand with
    // none in frame — a busy background is full of hand-shaped clutter
    // and the 0.5 defaults hallucinate there; a ghost hand can grab items
    // and false-trigger gestures). 0.65 helped but the ghost
    // survived → 0.7. Ease back toward 0.65 if real-hand pickup ever
    // feels laggy; past 0.75 real tracking suffers.
    minHandDetectionConfidence: 0.6,
    // v3.9.9 (his blur diagnosis: fast hands smear and get DROPPED,
    // and re-acquisition eats the frames that felt like grab-lag):
    // KEEP-tracking eased to 0.5 so a latched hand rides through blur;
    // fresh DETECTION stays 0.7 — the busy-background ghost wall holds.
    minHandPresenceConfidence: 0.5 });
  document.getElementById("boot").remove();
  await loadTree();
  spawnStage();
  toast("smooth pinch mode", 2000);
  let lastT = performance.now();

  function frame(now) {
    const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now;
    if (cam.currentTime !== lastVideoTs) {
      lastVideoTs = cam.currentTime;
      const res = landmarker.detectForVideo(cam, now);
      const seen = new Set();
      (res.landmarks || []).forEach((lms, i) => {
        seen.add(i);
        const cur = getCursor(i);
        const tip = toScreen(lms[8]), thumb = toScreen(lms[4]);
        const span = Math.hypot(lms[0].x - lms[9].x, lms[0].y - lms[9].y);
        // v3.9.3: palm-axis upness (1 = fingers straight up) — the clap
        // only listens to prayer-vertical hands (Jared's rule)
        cur.handUp = span > 0 ? (lms[0].y - lms[9].y) / span : 0;
        const _w = toScreen(lms[0]), _m = toScreen(lms[9]);
        cur.wristX = _w.x; cur.wristY = _w.y;   // v3.9.7: the prayer read
        cur.mcpX = _m.x; cur.mcpY = _m.y;
        const gap = Math.hypot(lms[4].x - lms[8].x, lms[4].y - lms[8].y);
        const ratio = span > 0 ? gap / span : 1;
        const px = (tip.x + thumb.x) / 2, py = (tip.y + thumb.y) / 2;
        cur.x += (px - cur.x) * 0.60; cur.y += (py - cur.y) * 0.60;
        cur.history.push({ x: cur.x, y: cur.y, t: now });
        if (cur.history.length > 10) cur.history.shift();   // v3.6: peak-fling window

        const wasPinched = cur.pinched;
        const W0 = lms[0];
        const extArr = [[8, 5], [12, 9], [16, 13], [20, 17]].map(([t, m]) =>
          Math.hypot(lms[t].x - W0.x, lms[t].y - W0.y) >
          1.45 * Math.hypot(lms[m].x - W0.x, lms[m].y - W0.y));
        const extFingers = extArr.filter(Boolean).length;
        const holdingI = items.some(k => k.grabbedBy.includes(i));

        // SMOOTH PINCH MODE
        // The old classifier used a long posture/EMA/probation chain.
        // That made a real thumb+index touch feel late or fail completely.
        // We now use the actual thumb-index gap as the primary signal, with
        // a light shape check only to keep obvious fists from triggering.
        const palmW = Math.hypot(lms[5].x - lms[17].x,
                                 lms[5].y - lms[17].y);
        const aspect = palmW > 0 ? span / palmW : 9;
        const fR = (t, m) => {
          const td = Math.hypot(lms[t].x - W0.x, lms[t].y - W0.y);
          const md = Math.hypot(lms[m].x - W0.x, lms[m].y - W0.y);
          return md > 0 ? td / md : 9;
        };
        const f8v = fR(8, 5);
        const backMean = (fR(12, 9) + fR(16, 13) + fR(20, 17)) / 3;
        const tRel = span > 0 ? Math.hypot(
          lms[4].x - lms[13].x, lms[4].y - lms[13].y) / span : 0;
        const okBack = (backMean - f8v > 0.18 && backMean > 1.30) ||
                       (aspect < 2.0 && tRel > 0.95);

        // Calculate hand speed for a safer release while dragging.
        let hspd = 0;
        const hh0 = cur.history;
        if (hh0.length >= 2) {
          const p0 = hh0[0], p1 = hh0[hh0.length - 1];
          const pdt = (p1.t - p0.t) / 1000;
          if (pdt > 0) hspd = Math.hypot(p1.x - p0.x, p1.y - p0.y) / pdt;
        }
        const relBar = hspd > 800 ? 0.70 : 0.55;
        const openRead = ratio >= relBar;
        const relOk = hspd > 800 ? (openRead && cur.openPrev) : openRead;
        cur.openPrev = openRead;

        // Primary pinch: thumb + index are genuinely close.
        // The shape check is intentionally forgiving so camera angle does
        // not make a good pinch disappear. Holding an object keeps the grab.
        const pinchClose = ratio < (aspect < 2.0 ? 0.40 : 0.36);
        const pinchShape = okBack || extFingers >= 2 || holdingI;
        const handGarbage = aspect > 6;
        cur.pinched = handGarbage ? false
                    : wasPinched ? !relOk
                    : pinchClose && pinchShape;
        cur.probKill = handGarbage;
        if (cur.pinched && !wasPinched) cur.badRun = 0;

        if (cur.pinched) cur.lastPinchT = now;   // v3.9: clap disqualifier
        cur.el.classList.toggle("pinched", cur.pinched);
        cur.el.style.left = cur.x + "px"; cur.el.style.top = cur.y + "px";

        // ---- THE PALM ENGINE — a gesture set designed for imperfect,
        // real-world hands: every trigger is finger EXTENSION
        // or GROSS travel, never stillness or timing rhythms).
        // OPEN  = pinch a note card, release into a FULL palm spread
        // CLOSE = open-hand swipe across the screen (closes open notes)
        // CLEAR = open palm thrust AT the camera (wipes the whole board)
        const palmOpen = extFingers >= 4 && ratio > 0.8;
        cur.palmOpen = palmOpen;
        cur.softOpen = extFingers >= 3 && ratio > 0.7;  // the forgiving open read

        if (cur.pinched && !wasPinched) {
          cur.pinchT = now;
          // v19.2 (Jared's confirm): the BIRTH-SPEED gate. Wave blur
          // enters a phantom pinch and the 0.34-in/0.50-out hysteresis
          // holds it for the whole sweep — long enough to beat any
          // duration gate, grab the note, and fire the horizontal-fling
          // close at wave velocity. The tell is the birth moment: a
          // real pinch is born on a hand settling onto its target; a
          // blur pinch is born mid-sweep at full speed. Born over
          // ~900px/s = a ghost — it cannot grab at all.
          const bh = cur.history;
          let born = 0;
          if (bh.length >= 2) {
            const a = bh[0], b = bh[bh.length - 1], dt = (b.t - a.t) / 1000;
            if (dt > 0) born = Math.hypot(b.x - a.x, b.y - a.y) / dt;
          }
          cur.ghost = born > 900;
          if (!cur.ghost) {
            const c = hitTest(cur);
            if (c && c.grabbedBy.length < 2 && !c.grabbedBy.includes(i))
              beginGrab(c, i, cur);
          }
        } else if (cur.pinched && cur.ghost) {
          // v3.9.8 (his rush-grab report: "my hand rushes up, pinches,
          // and it won't grab — I'm having to wait"): a pinch born at
          // speed is ghost-flagged (the wave-blur armor) and used to
          // stay barren until re-pinched. Now it SELF-HEALS: the
          // moment the hand decelerates onto its target, the grab
          // fires — no release, no wait.
          if (hspd < 500 && !items.some(k => k.grabbedBy.includes(i))) {
            cur.ghost = false;
            const c = hitTest(cur);
            if (c && c.grabbedBy.length < 2 && !c.grabbedBy.includes(i))
              beginGrab(c, i, cur);
          }
        } else if (!cur.pinched && wasPinched) {
          // GESTURE v3 (2026-08-14): the double-flash arming machinery
          // is GONE — the tap opens AND closes (endGrab, v3.1)
          const c = items.find(k => k.grabbedBy.includes(i));
          if (c) endGrab(c, i, cur);
          cur.scrub = null;
        }

        // THE EXPLODE SCRUB — hands drive it too, not just the
        // assistant's explode/assemble verbs: an EMPTY
        // pinch dragged sideways drives the freshest parted model's
        // explosion by hand: right = apart, left = together. The slot
        // was unoccupied (empty pinches did nothing), so the settled
        // vocabulary is untouched; 30px of deliberate sideways travel
        // must accrue before it engages, so a missed grab stays a miss.
        if (cur.pinched && !items.some(k => k.grabbedBy.includes(i))) {
          if (!cur.scrub) {
            const m = items.filter(k => k.type === "model" &&
                                        k.exCap && k.el.isConnected).pop();
            cur.scrub = m ? { id: m.id, sx: cur.x, base: m.ex || 0,
                              live: false } : { id: null };
          } else if (cur.scrub.id != null) {
            const m = items.find(k => k.id === cur.scrub.id);
            if (m && m.el.isConnected) {
              const dx = cur.x - cur.scrub.sx;
              if (!cur.scrub.live && Math.abs(dx) > 30) {
                cur.scrub.live = true;
                cur.scrub.sx = cur.x;      // re-anchor at engage
                toast(m.ex > 0.5 ? "scrubbing — drag left to rebuild"
                                 : "scrubbing — drag right to open", 900);
              }
              if (cur.scrub.live) {
                const MIR = -1;            // mirrored tracker: his
                                           // rightward hand = leftward x
                m.ex = Math.max(0, Math.min(1,
                  cur.scrub.base + MIR * (cur.x - cur.scrub.sx) / 340));
              }
            }
          }
        } else if (!cur.pinched) cur.scrub = null;

        if (!cur.pinched) {
          // (an old open-palm wipe gesture died here — too easy to
          // fire by accident. Clear = clap, then toss the ring. Only
          // the open-hand clock survives — the claw's transition law
          // feeds on it.)
          if (cur.palmOpen || cur.softOpen) cur.lastOpenT = now;
          if (cur.softOpen) cur.lastSoftT = now;   // the clap's open-approach read
        }

        // ---- THE FORCE PULL v6 — THE CLAW (Jared's gesture design,
        // photo-specced 2026-08-13 night; replaces v5's two-pose scope
        // — no flat-splay arming, ONE iconic pose does it all): the
        // CLAW — fingers hooked, thumb opposing, a wide C-gap — AIMS
        // through its mouth: the ray runs wrist → the thumb/index gap
        // midpoint (the cursor), out as a narrow ~14° cone. The aimed
        // target lights and SHAKES, ramping harder the longer the claw
        // holds it (his spec: the strain builds; nothing ever moves
        // until the grab). SNAPPING THE CLAW SHUT — the gap collapse,
        // the tracker's most reliable signal — rips it in; the fist
        // carries it; open hand releases. Claw dropped = everything
        // settles. Parked hands can't claw; nothing fires without the
        // deliberate snap.
        {
          const heldAny = items.some(k => k.grabbedBy.includes(i));
          if (!cur.fp) cur.fp = { ph: 0, pose: 0 };
          const fp = cur.fp;
          // v6.1 (field round 6 — the claw never registered): the old
          // extFingers gate read his HOOKED fingers as extended (a hook
          // still REACHES — tips stay far from the wrist). The claw's
          // true signature is the HOOK ITSELF: tip folded back near the
          // knuckle radius (tip-dist / pip-dist small) while a straight
          // finger's tip sits well beyond it. Live numbers on the D
          // overlay so thresholds tune against Jared's real hand.
          const hookR = (tip, pip) => {
            // v3.3 (his false-trigger photo: EXTENDED fingers tilted at
            // the camera foreshorten in 2D until they read as hooks):
            // measured in 3D — MediaPipe z kills the illusion. A real
            // hook's tip folds back toward the wrist in any orientation;
            // an extended finger stays far in any orientation.
            const td = Math.hypot(lms[tip].x - W0.x, lms[tip].y - W0.y,
                                  (lms[tip].z || 0) - (W0.z || 0));
            const pd = Math.hypot(lms[pip].x - W0.x, lms[pip].y - W0.y,
                                  (lms[pip].z || 0) - (W0.z || 0));
            return pd > 0 ? td / pd : 9;
          };
          // v3.4 THE CURL TEST (2026-08-14, fitted from his DOUBLE
          // P-sample — real claw vs the duck-bill impostor came back
          // IDENTICAL in every distance ratio (h8 median 1.05 vs 1.07):
          // monocular z is too weak for distances. What separates the
          // photos is the FOLD: a hooked finger's distal segment points
          // back AGAINST its proximal segment (dot < 0-ish); an extended
          // finger's segments stay aligned (dot ~ +0.9) in ANY camera
          // orientation — angles survive the foreshortening that lies
          // about lengths. Distance ratios stay only as loose sanity
          // rails around his measured real-claw envelope.
          const seg = (a, b) => {
            const dx = lms[b].x - lms[a].x, dy = lms[b].y - lms[a].y,
                  dz = (lms[b].z || 0) - (lms[a].z || 0);
            const l = Math.hypot(dx, dy, dz) || 1;
            return [dx / l, dy / l, dz / l];
          };
          const curl = (mcp, pip, dip, tip) => {
            const p = seg(mcp, pip), d = seg(dip, tip);
            return p[0] * d[0] + p[1] * d[1] + p[2] * d[2];
          };
          const c8 = curl(5, 6, 7, 8), c12 = curl(9, 10, 11, 12);
          const c16 = curl(13, 14, 15, 16), c20 = curl(17, 18, 19, 20);
          // v3.5.3 — THE PINKY VERDICT (his real-claw s-sample killed
          // the spread theory: his hooks ride nearly together, s max
          // 0.30 vs the 0.32 floor). The discriminator was hiding in
          // the finger I benched two rounds ago: in ALL SEVEN real-claw
          // samples the pinky stays out STRAIGHT (c20 median 0.43-0.89
          // — look at the photo, it sticks out of the pose); the
          // relaxed curl folds it (max -0.29). Index+middle+ring
          // folded, pinky OUT, mouth open = the claw's fingerprint.
          // (spread stays measured for the sampler, ungated.)
          const tipGap = (a, b) => Math.hypot(
            lms[a].x - lms[b].x, lms[a].y - lms[b].y,
            (lms[a].z || 0) - (lms[b].z || 0));
          const spread = span > 0
            ? (tipGap(8, 12) + tipGap(12, 16) + tipGap(16, 20)) / (3 * span)
            : 0;
          // v3.5.4 (his hand-at-the-lens catch: fingers pointed INTO
          // the camera have no readable geometry — z is weakest there
          // and the curls come back garbage that reads folded): the 2D
          // tell is the PALM ASPECT — palm length (0→9) foreshortens
          // when pointing at the lens while knuckle width (5→17)
          // doesn't. A working claw is ~parallel to the screen (you
          // aim at ITEMS); aspect < ~1 = hand into the lens = no claw.

          const h8 = hookR(8, 6), h12 = hookR(12, 10);
          // v3.1 (his call: "when I actually make the FULL claw pose,
          // not just a C shape"): ring + pinky must hook too — a lazy C
          // with relaxed outer fingers no longer reads as the claw
          const h16 = hookR(16, 14), h20 = hookR(20, 18);
          // v6.2 HYSTERESIS (round 7 — the pose flickered in for a
          // millisecond and died: one knife-edge threshold served both
          // enter and hold): strict-ish to ENTER, loose to KEEP — the
          // pinch's proven 0.34-in/0.50-out pattern, applied to the claw
          // v6.3 — FITTED TO JARED'S MEASURED HAND (his P-sample,
          // 2026-08-13 night: r 0.52–1.03–1.24 · h8 0.70–1.04–1.18 ·
          // h12 0.56–0.93–1.10). The old 0.55 gap floor sat INSIDE his
          // natural envelope (min 0.52) — the pose flickered across the
          // boundary; hooks were never the problem. Bands now bracket
          // his envelope with margin; snap dropped to 0.38 to keep
          // clearance under the claw's deepest natural dip.
          const inClaw = fp.ph > 0 || cur.fpSplay;
          // v3.5 — FITTED TO HIS SIX-SAMPLE CORRECT-POSE CORPUS
          // (2026-08-14 midday, both hands, all orientations): the real
          // claw's curls vary widely EXCEPT the middle finger, which is
          // ALWAYS folded (median never above 0.04 in six runs); the
          // pinky often stays straight (median up to 0.89 — impostor
          // territory) so it carries NO vote. Gate = middle finger
          // leads (c12 < 0.35), index+middle+ring average confirms
          // (< 0.30 — his six sample-means: -0.35..+0.26; the duck-bill
          // sits ~+0.85), mouth + distance rails as sanity.
          const cMean = (c8 + c12 + c16) / 3;
          // v3.5.1 (his pointing-hand catch: index straight at 0.98,
          // rest folded — passed the mean at 0.25): the INDEX must fold
          // too — his real claws median ≤0.35 on c8, the pointer 0.98
          // v3.9.18 (his four-sample evening corpus): THE MOUTH is
          // the cut — both not-claws hold the C half-closed (max
          // 0.53), both real claws gape wide (min 0.64). Floor raised
          // mid-canyon to 0.58 (the v3.2 attempt at 0.60 failed
          // because THAT corpus pinched tighter; this one does not —
          // and the streak decay now absorbs formation dips).
          // v3.9.19 (his ruling on the metric twin: "a claw is
          // intentional. Bigger distance between thumb and index") —
          // the mouth must gape DELIBERATELY wide: floor 0.72 (the
          // twin impostor tops at 0.70; his widest claws ride 0.75+).
          // v3.9.20: "little bit bigger" — floor to 0.80
          const claw = ratio > (inClaw ? 0.68 : 0.80) &&
                       ratio < (inClaw ? 1.8 : 1.45) &&
                       c8    < (inClaw ? 0.8 : 0.6) &&
                       c12   < (inClaw ? 0.6 : 0.35) &&
                       // v3.9.21 (the camera-pointed hand gamed the
                       // MEAN: its foreshortened index read -0.53 and
                       // subsidized a dead-straight ring at 0.97 —
                       // real claws fold the ring ≤0.40): the ring
                       // votes alone now.
                       c16   < (inClaw ? 0.75 : 0.55) &&
                       cMean < (inClaw ? 0.55 : 0.30) &&
                       c20   > (inClaw ? -0.35 : 0.1) &&
                       aspect > (inClaw ? 0.85 : 1.05) &&
                       h8 < (inClaw ? 1.6 : 1.5) &&
                       h12 < (inClaw ? 1.6 : 1.5) &&
                       h16 < (inClaw ? 1.6 : 1.5);
          // v6.5 THE PLUNGE (round 12 — the fist missed 3-in-a-row: a
          // real fist's thumb wraps OVER the curled fingers and the 2D
          // tip gap often bottoms out ABOVE an absolute floor, drifting
          // with camera angle). The robust signal is the COLLAPSE
          // SPEED: a snap plunges the gap fast; aiming drift never
          // does. Fire on deep-absolute OR fast-plunge-below-the-claw.
          if (!cur.rh) cur.rh = [];
          cur.rh.push([now, ratio]);
          while (cur.rh.length && now - cur.rh[0][0] > 400) cur.rh.shift();
          let rPeak = 0;
          for (const rr of cur.rh)
            if (now - rr[0] <= 280 && rr[1] > rPeak) rPeak = rr[1];
          const snap = ratio < 0.34 ||
                       (ratio < 0.48 && rPeak - ratio > 0.22);
          cur.fpSplay = claw;                // debug-overlay telemetry
          if (!cur.fpDbgT || now - cur.fpDbgT > 400) {
            cur.fpDbgT = now;                // readable refresh rate
            cur.fpDbg = `r:${ratio.toFixed(2)} ` +
                        `c:${c8.toFixed(2)}/${c12.toFixed(2)}/` +
                        `${c16.toFixed(2)}/${c20.toFixed(2)} ` +
                        `s:${spread.toFixed(2)} a:${aspect.toFixed(2)}`;
          }
          if (SAMPLER) {                     // the P OMNI-SAMPLER
            // (v3.9.28 — no more mode churn): records BOTH families —
            // claw metrics (r, curls, spread, aspect) AND pinch
            // metrics (arch ratios f*, thumb t) — toasts two lines.
            if (now < SAMPLER.until) {
              SAMPLER.r.push(ratio); SAMPLER.h8.push(c8);
              SAMPLER.h12.push(c12);
              SAMPLER.h16.push(c16); SAMPLER.h20.push(c20);
              SAMPLER.s.push(spread); SAMPLER.a.push(aspect);
              const fRs = (t, m) => {
                const td = Math.hypot(lms[t].x - W0.x, lms[t].y - W0.y);
                const md = Math.hypot(lms[m].x - W0.x, lms[m].y - W0.y);
                return md > 0 ? td / md : 9;
              };
              if (!SAMPLER.f8) { SAMPLER.f8 = []; SAMPLER.f12 = [];
                SAMPLER.f16 = []; SAMPLER.f20 = []; SAMPLER.t = []; }
              SAMPLER.f8.push(fRs(8, 5)); SAMPLER.f12.push(fRs(12, 9));
              SAMPLER.f16.push(fRs(16, 13)); SAMPLER.f20.push(fRs(20, 17));
              SAMPLER.t.push(span > 0 ? Math.hypot(
                lms[4].x - lms[13].x, lms[4].y - lms[13].y) / span : 9);
            } else {
              const stat = a => {
                if (!a.length) return "-";
                a.sort((x, y) => x - y);
                const f = v => v.toFixed(2);
                return f(a[0]) + "–" + f(a[Math.floor(a.length / 2)]) +
                       "–" + f(a[a.length - 1]);
              };
              SAMPLED = `CLAW r ${stat(SAMPLER.r)} · c8 ` +
                        `${stat(SAMPLER.h8)} · c12 ${stat(SAMPLER.h12)}` +
                        ` · c16 ${stat(SAMPLER.h16)} · c20 ${stat(SAMPLER.h20)}` +
                        ` · s ${stat(SAMPLER.s)} · a ${stat(SAMPLER.a)}\n` +
                        `PINCH f8 ${stat(SAMPLER.f8 || [])} · f12 ` +
                        `${stat(SAMPLER.f12 || [])} · f16 ${stat(SAMPLER.f16 || [])}` +
                        ` · f20 ${stat(SAMPLER.f20 || [])} · t ${stat(SAMPLER.t || [])}`;
              toast(SAMPLED, 20000);
              SAMPLER = null;
            }
          }
          const unlight = () => {
            const t = items.find(k => k.id === fp.tId);
            if (t && !t.grabbedBy.length) { t.jx = t.jy = 0; t.hch = 0; }
            fp.tId = null;
          };
          // v3.5: a one-frame tracking hiccup used to zero the pose
          // streak (the "only triggers sometimes") — now it decays
          fp.pose = claw ? (fp.pose || 0) + 1 : Math.max(0, (fp.pose || 0) - 5);
          if (fp.ph === 0) {
            // v7 THE TRANSITION LAW (2026-08-14, Jared's field find:
            // "anytime my hand was arched it thought I was summoning" —
            // his relaxed post-pinch arch lives inside the claw bands).
            // A claw is a MOVEMENT, not a shape: it only arms when the
            // hooks formed FROM AN OPEN HAND within the last ~0.9s, and
            // only after ~half a second of held pose (14 frames) so a
            // drifting arch never even starts the show. The strain, the
            // 2s law, and the plunge are untouched.
            if (!heldAny && fp.pose >= 14 && !hitTest(cur) &&
                now - (cur.lastOpenT || 0) < 900) {
              fp.ph = 1; fp.lost = 0; fp.tId = null;
            } else if (fp.pose === 20 && !heldAny &&
                       now - (cur.lastOpenT || 0) >= 900) {
              // the honest tell for a drift-in arch (once per run)
              toast("claw ignored — flash OPEN first, then claw", 1300);
            }
          } else {
            if (claw) fp.lost = 0;
            else if (!fp.lost) fp.lost = now;
            if (heldAny || (fp.lost && !snap && now - fp.lost > 300)) {
              unlight(); fp.ph = 0;
            } else if (snap && fp.tId != null) {   // THE SNAP — take it
              // THE 2-SECOND STRAIN LAW (round 11, Jared's call: items
              // were popping to his hand uncalled): nothing moves until
              // it has SHAKEN for 2 full seconds — an early snap is a
              // misfire and just drops the lock. The strain ramp peaks
              // at ~2s, so fully-rattling and takeable are the same
              // visible moment.
              if (now - (fp.litT || 0) >= 2000) {
                const t = items.find(k => k.id === fp.tId);
                unlight(); fp.ph = 0;
                if (t && !t.grabbedBy.length && t.el.isConnected) {
                  t.hch = 0.6;
                  t.anim = { k: "pull", t: 0, x0: t.x, y0: t.y, ci: i };
                }
              } else {
                unlight(); fp.ph = 0;
                toast("too soon — let it strain 2 seconds", 900);
              }
            } else if (claw) {
              // v6.4 — the aim ray is the claw MOUTH'S NORMAL (his
              // two-photo catch: the old wrist→cursor ray tied aim to
              // WRIST rotation, forcing him to tip the whole hand down
              // to aim level; his original spec was right all along —
              // "the space between is the targeting"). Perpendicular
              // to the thumbtip↔indextip line, signed away from the
              // palm: the ray follows the C-shape itself, upright
              // wrist and all.
              const t4 = toScreen(lms[4]), t8 = toScreen(lms[8]);
              const p5 = toScreen(lms[5]), p17 = toScreen(lms[17]);
              const pcx = (p5.x + p17.x) / 2, pcy = (p5.y + p17.y) / 2;
              let dx = -(t8.y - t4.y), dy = t8.x - t4.x;
              if (dx * (cur.x - pcx) + dy * (cur.y - pcy) < 0) {
                dx = -dx; dy = -dy;        // face away from the palm
              }
              const dl = Math.hypot(dx, dy) || 1;
              dx /= dl; dy /= dl;
              let best = null, bestScore = 1e9;
              items.forEach(t => {
                if (!t.el.isConnected || t.grabbedBy.length) return;
                // v3.9.33 (Jared: "I need to be able to claw the
                // folders"): browser panes join the claw's menu; orbs
                // stay out (pinned furniture), notes stay out.
                if (t.type === "orb" || t.type === "panel") return;
                const vx = t.x - cur.x, vy = t.y - cur.y;
                if (Math.hypot(vx, vy) < 160) return;   // close = pinch
                const proj = vx * dx + vy * dy;
                if (proj <= 0) return;       // behind the aim — never
                const perp = Math.abs(vx * dy - vy * dx);
                if (perp > proj * 0.25) return;   // the narrow cone
                if (perp < bestScore) { bestScore = perp; best = t; }
              });
              if (best && best.id !== fp.tId) {
                unlight();
                fp.tId = best.id; fp.litT = now;   // fresh strain ramp
                fp.readyToasted = false;
                best.flying = false; best.anim = null;
                toast("aiming: " + (best.def.title || (best.def.src ||
                  best.type).split("/").pop()) + " — hold the strain",
                  900);
              } else if (!best && fp.tId != null) {
                unlight();                   // swept off every target
              }
              const lit = items.find(k => k.id === fp.tId);
              if (lit) {
                // v3.2 (Jared, 8/14: "increase the intensity by 2.5 or
                // 3x and ramp it over time... the ramp should be 4
                // seconds" — the shake reads small on stream at 2x
                // scale): triple peak amplitude, 4s ramp. The 2s law
                // is untouched — snap unlocks at 2s, mid-ramp.
                const hold = Math.min(1, (now - fp.litT) / 4000);
                const amp = 4 + hold * 40;
                lit.jx = (Math.random() - 0.5) * amp;
                lit.jy = (Math.random() - 0.5) * amp;
                lit.hch = 0.35 + hold * 0.65;
                if (!fp.readyToasted && now - fp.litT >= 2000) {
                  fp.readyToasted = true;    // the takeable moment
                  toast("it's straining — SNAP to take it", 1100);
                }
              }
            }
          }
        }

        // drag / scroll / stretch
        const held = items.find(k => k.grabbedBy.includes(i));
        if (held) {
          if (held.mode === "stretch" && held.stretch && held.grabbedBy.length === 2) {
            const a = cursors[held.grabbedBy[0]], b = cursors[held.grabbedBy[1]];
            const d = Math.hypot(a.x - b.x, a.y - b.y);
            // v-free scale (Jared's ask 8/8: "as big or as small as I
            // want") — ceiling 12x fills any screen; floor 0.12 keeps a
            // shrunken item big enough to ever pinch again
            held.scale = Math.min(12, Math.max(0.12,
              held.stretch.s0 * (d / held.stretch.d0)));
            held.stretchT = performance.now();   // fling suppressor (see endGrab)
            held.x = (a.x + b.x) / 2; held.y = (a.y + b.y) / 2;
            // v3 (Jared's ruling 2026-08-14): the two-hand TWIST-ROLL is
            // dead — two hands = carry + SCALE only; all rotation lives
            // in the one-hand hold-still latch.
          } else if (held.mode === "scroll" && held.grabbedBy[0] === i) {
            // scrolling (content follows the finger) + the hold-to-move
            // promotion timer running underneath
            const box = held.body.parentElement.clientHeight;
            const maxS = Math.max(0, held.body.offsetHeight - box + 40);
            held.scrollY = Math.min(maxS, Math.max(0,
              held.scroll0 - (cur.y - held.grabY0) * 1.4));
            held.body.style.transform = `translateY(${-held.scrollY}px)`;
            const drift = Math.hypot(cur.x - held.holdX, cur.y - held.holdY);
            if (drift > 80) {
              // drifted out of the hold zone: re-anchor, restart the timer
              held.holdX = cur.x; held.holdY = cur.y;
              held.holdT = performance.now(); held.hch = 0;
              held.scroll0 = held.scrollY; held.grabY0 = cur.y;
            } else {
              const p = Math.min((performance.now() - held.holdT) / 1000, 1);
              held.hch = p;
              if (p >= 1) {              // PROMOTED: latched to the hand
                held.mode = "move";
                held.ox = held.x - cur.x; held.oy = held.y - cur.y;
                held.holdX = cur.x; held.holdY = cur.y;   // rotate chain arms
                held.holdT = performance.now();
                held.hch = 0.6;          // the steady "movable" glow
              }
            }
          } else if (held.mode === "rotate" && held.grabbedBy[0] === i) {
            // Build 1: orbit — hand X spins yaw, hand Y tilts pitch.
            // GLASS ERA: UI panes clamp yaw too (past ~90° the text
            // mirrors); models keep the free spin + release momentum
            const ROT = 0.012;
            let ny = held.rot0y + (cur.x - held.grabX0) * ROT;
            if (held.type !== "model")
              ny = Math.max(-1.2, Math.min(1.2, ny));
            held.ry = ny;
            held.rx = Math.max(-1.2, Math.min(1.2,
              held.rot0x + (cur.y - held.grabY0) * ROT));
            if (held.type === "model") {
              const rh = cur.history;
              if (rh.length >= 2) {
                const ra = rh[0], rb = rh[rh.length - 1];
                const rdt = (rb.t - ra.t) / 1000;
                held.rvy = rdt > 0 ? ((rb.x - ra.x) / rdt) * ROT : 0;
              }
            }
          } else if (held.mode === "move" && held.grabbedBy[0] === i) {
            // GLASS ERA: the model hold-to-spin promotion, generalized
            // to EVERY item — carried like a card; hold roughly still
            // ~1s and it latches into 3D rotate (drift re-anchors)
            held.x = cur.x + held.ox; held.y = cur.y + held.oy;
            // v3: latch demands genuine stillness (80→45px) so a
            // mid-drag hesitation can't trip 3D mode uninvited
            const mdrift = Math.hypot(cur.x - held.holdX, cur.y - held.holdY);
            if (mdrift > 45) {
              held.holdX = cur.x; held.holdY = cur.y;
              held.holdT = performance.now(); held.hch = 0;
            } else {
              const mp = Math.min((performance.now() - held.holdT) / 1000, 1);
              held.hch = mp;
              if (mp >= 1) {               // LATCHED: 3D rotate
                held.mode = "rotate";
                held.rot0x = held.rx || 0; held.rot0y = held.ry || 0;
                held.grabX0 = cur.x; held.grabY0 = cur.y;
                held.rvy = 0; held.hch = 0.6;   // steady "rotating" glow
                toast(held.type === "model"
                  ? "spin mode — move your hand to turn it"
                  : "3D rotate — move your hand to turn it", 1400);
              }
            }
          }

        }
        if (dbg.style.display === "block")
          dbg.textContent = `mode ${MODE}\nfps ${fps}\nhands ${res.landmarks.length}` +
            `\npinch ${ratio.toFixed(2)} ${cur.pinched ? "CLOSED" : "open"}` +
            `\npalm ${cur.palmOpen ? "OPEN" : "-"}${cur.fpSplay ? " CLAW" : ""} pull ph${cur.fp ? cur.fp.ph : 0}` +
            `\n${cur.fpDbg || ""}` + (SAMPLED ? `\n${SAMPLED}` : "");
      });
      Object.keys(cursors).map(Number).forEach(i => { if (!seen.has(i)) dropCursor(i); });

      // ---- GESTURE v3.9: THE DELIBERATE CLAP (Jared, after false
      // resets kept wiping his pinch tests: "that reset needs to be
      // more deliberate!"). Three locks on top of the speed signature:
      // (1) both hands OPEN during the WIDE approach — a pinching hand
      // can't start a clap; openness is only waived near contact,
      // where the blur lives; (2) MUTUAL motion — both hands must
      // travel toward each other; one hand sweeping past a parked
      // hand is dead; (3) any hand that pinched in the last 800ms is
      // disqualified outright.
      const cids = Object.keys(cursors);
      const clapFire = () => {
        loadTree().then(() => spawnStage(0.5, 0.42));   // the ring, center
        lastResetT = now; clap.hist.length = 0;
        toast("clap — ring center stage", 900);
      };
      const clapCool = now - lastResetT > 1500 && now - lastClearT > 2500;
      if (cids.length === 2) {
        const A = cursors[cids[0]], B = cursors[cids[1]];
        const recentPinch = A.pinched || B.pinched ||
          now - Math.max(A.lastPinchT || 0, B.lastPinchT || 0) < 800;
        if (!items.some(k => k.grabbedBy.length) && !recentPinch) {
          // v3.9.7 — THE PRAYER LAW (Jared's final spec: "my two palms
          // must make contact and my fingers must be pointed UP").
          // Pose-first, motion-demoted: fingertip touches leave the
          // WRISTS far apart (a tent); palm contact brings wrists +
          // knuckle rows together. Speed no longer matters — only
          // that the hands WERE apart in the last 800ms (so resting
          // prayer hands can't refire).
          const wristD = Math.hypot(
            (A.wristX || 0) - (B.wristX || 0),
            (A.wristY || 0) - (B.wristY || 0));
          const mcpD = Math.hypot(
            (A.mcpX || 0) - (B.mcpX || 0),
            (A.mcpY || 0) - (B.mcpY || 0));
          const bothOpen =
            (A.softOpen || now - (A.lastSoftT || 0) < 250) &&
            (B.softOpen || now - (B.lastSoftT || 0) < 250);
          const bothUp = (A.handUp || 0) > 0.85 && (B.handUp || 0) > 0.85;
          clap.hist.push({ t: now, w: wristD,
                           q: (bothOpen && bothUp) ? 1 : 0 });
          while (clap.hist.length && now - clap.hist[0].t > 900)
            clap.hist.shift();
          const wasApart = clap.hist.some(
            s => now - s.t <= 800 && s.w > innerWidth * 0.18);
          if (wristD < innerWidth * 0.11 && mcpD < innerWidth * 0.09 &&
              bothUp && bothOpen && wasApart && clapCool)
            clapFire();
        } else clap.hist.length = 0;
      } else if (clap.hist.length) {
        // palms merged into one detection at contact: the vanish read —
        // honored only if the pose was QUALIFIED (open + vertical) and
        // closing when tracking died
        const last = clap.hist[clap.hist.length - 1];
        if (now - last.t < 200 && last.q && last.w < innerWidth * 0.16 &&
            clap.hist.some(s => last.t - s.t <= 800 &&
                                s.w > innerWidth * 0.18) &&
            clapCool) clapFire();
        else clap.hist.length = 0;
      }

      // ---- the P CLAP recorder (v3.9.1): reports the strike anatomy
      // in the gate's own terms so thresholds tune against HIS clap
      if (CLAPSAMP) {
        if (now < CLAPSAMP.until) {
          if (cids.length === 2) {
            const A = cursors[cids[0]], B = cursors[cids[1]];
            CLAPSAMP.rows.push({ t: now,
              d: Math.hypot(A.x - B.x, A.y - B.y),
              ax: A.x, ay: A.y, bx: B.x, by: B.y,
              o: ((A.softOpen || now - (A.lastSoftT || 0) < 250) &&
                  (B.softOpen || now - (B.lastSoftT || 0) < 250)) ? 1 : 0,
              u: ((A.handUp || 0) > 0.85 && (B.handUp || 0) > 0.85) ? 1 : 0,
              p: (A.pinched || B.pinched) ? 1 : 0 });
          }
        } else {
          const R = CLAPSAMP.rows; CLAPSAMP = null;
          if (R.length < 5) {
            toast("CLAP sample: not enough two-hand frames — keep both hands on camera", 5000);
          } else {
            const W = innerWidth;
            let best = null;
            for (let i2 = 0; i2 < R.length; i2++)
              for (let j2 = i2 + 1;
                   j2 < R.length && R[j2].t - R[i2].t <= 600; j2++) {
                const closed = R[i2].d - R[j2].d;
                if (!best || closed > best.closed)
                  best = { closed, s: R[i2], e: R[j2] };
              }
            const dMax = Math.max(...R.map(r => r.d)) / W;
            const dMin = Math.min(...R.map(r => r.d)) / W;
            const wide = R.filter(r => r.d > W * 0.25);
            const openPct = wide.length ? Math.round(
              100 * wide.filter(r => r.o).length / wide.length) : -1;
            const pinchPct = Math.round(
              100 * R.filter(r => r.p).length / R.length);
            let line = `CLAP dmax ${dMax.toFixed(2)}W dmin ${dMin.toFixed(2)}W`;
            if (best && best.closed > 0) {
              const mA = Math.hypot(best.e.ax - best.s.ax,
                                    best.e.ay - best.s.ay) / best.closed;
              const mB = Math.hypot(best.e.bx - best.s.bx,
                                    best.e.by - best.s.by) / best.closed;
              line += ` · strike ${(best.s.d / W).toFixed(2)}→` +
                      `${(best.e.d / W).toFixed(2)}W in ` +
                      `${Math.round(best.e.t - best.s.t)}ms · mA ` +
                      `${mA.toFixed(2)} mB ${mB.toFixed(2)}`;
            }
            const upPct = wide.length ? Math.round(
              100 * wide.filter(r => r.u).length / wide.length) : -1;
            line += ` · open ${openPct}% · up ${upPct}% · pinch ${pinchPct}%`;
            toast(line, 20000);
          }
        }
      }

      frames++;
      if (now - lastFpsTs > 1000) { fps = frames; frames = 0; lastFpsTs = now; }
    }
    physics(dt);
    renderModels();           // the 3D holograms draw their frames
    renderRings();            // the ring draws its frames (both pages)
    pushState(now);           // stream the scene to the OBS render page
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// ---- THE SPLIT (the true-transparency requirement — a chroma-key
// screen tints the presenter's body on camera). Two pages, one scene:
// the TRACKER (this page, default role) owns the camera + physics and
// streams normalized scene state to /state at ~45Hz; the RENDER role
// (?role=render, camera-free, truly transparent) mirrors it — THAT page
// goes in an OBS browser source, which composites CSS transparency as
// real alpha. Coordinates travel as window FRACTIONS so tracker window
// and OBS canvas sizes may differ.

let lastPush = 0;
function pushState(now) {
  if (now - lastPush < 22) return;
  lastPush = now;
  const st = {
    cursors: Object.keys(cursors).sort().map(k => {
      const c = cursors[k];
      return { x: +(c.x / innerWidth).toFixed(4), y: +(c.y / innerHeight).toFixed(4),
               p: c.pinched ? 1 : 0, d: 0 };
    }),
    items: items.filter(i => i.el.isConnected).map(i => {
      // charge glow now serves the hover verb only (dwell-open retired
      // for double-pinch, Jared's call 2026-08-07)
      const ch = 0;
      // v20.3: scroll travels as a FRACTION of max-scroll, not pixels —
      // the render window's text wraps differently than the tracker's,
      // so a pixel offset left the overlay's bottom unreachable (the
      // same window-fraction law the v4 split gave positions)
      let syf;
      if ((i.type === "panel" || i.type === "browser") && i.body) {
        const sbox = i.body.parentElement.clientHeight;
        const smax = Math.max(0, i.body.offsetHeight - sbox + 40);
        syf = smax ? +((i.scrollY || 0) / smax).toFixed(4) : 0;
      }
      return {
        id: i.id, type: i.type,
        title: i.type === "panel"
               ? i.def.file.split("/").pop().replace(".md", "") : i.def.title,
        body: (i.type === "card" || i.type === "orb") ? i.def.body : undefined,
        src: (i.type === "img" || i.type === "model") ? i.def.src : undefined,
        w: i.type === "widget" ? i.def.w : undefined,
        mm: i.type === "model" ? i.def.mmode : undefined,
        lf: i.type === "model" ? i.def.lift : undefined,
        ex: i.type === "model" && i.ex ? +(+i.ex).toFixed(2) : undefined,
        rx: i.type === "model" || i.rx ? +(i.rx || 0).toFixed(3) : undefined,
        ry: i.type === "model" || i.ry ? +(i.ry || 0).toFixed(3) : undefined,
        rz: i.type === "model" || i.rz ? +(i.rz || 0).toFixed(3) : undefined,
        rows: i.type === "browser" ? i.rowTuples : undefined,
        rv: i.type === "browser" ? i.rowsV : undefined,
        fi: i.type === "browser" ? i.flashI : undefined,
        fv: i.type === "browser" ? i.flashV : undefined,
        fxf: i.def.fx ? 1 : undefined,
        vd: i.def.vid ? 1 : undefined,
        file: i.def.file,
        x: +((i.x + (i.jx || 0)) / innerWidth).toFixed(4),
        y: +((i.y + (i.jy || 0)) / innerHeight).toFixed(4),
        scale: +(i.scale * (i.hs || 1) * (i.inS || 1)).toFixed(3),
        g: i.grabbedBy.length ? 1 : 0,
        op: i.el.style.opacity === "" ? 1 : +(+i.el.style.opacity).toFixed(2),
        ch: +Math.max(ch, i.hch || 0).toFixed(2),
        sy: syf,
      };
    }),
  };
  fetch("/state", { method: "POST", body: JSON.stringify(st) })
    .then(r => r.json()).then(applyCmds).catch(() => {});
}

// (an earlier whole-screen voice-pulse aura was removed — THE RING
// carries the assistant's presence now.)

const ROLE = Q.get("role") || "stage";
// The tracker's scene lives in MIRROR space (selfie view). OBS shows the
// camera UN-mirrored (broadcast standard), so the render page flips X by
// default — reach left, cursor goes left, on camera (Jared's "it's
// backwards" catch, 2026-08-07). If your OBS camera source IS mirrored,
// add &mirror=1 to the render URL and the flip turns off.
const RFLIP = Q.get("mirror") === "1" ? false : true;
const rx = f => RFLIP ? 1 - f : f;
// &cursors=0 hides the green rings from the broadcast — bare hands only,
// maximum sorcery (Jared's call 2026-08-07); the card's charge glow
// carries the dwell cue instead; the tracker page stays your monitor
const SHOW_CURSORS = Q.get("cursors") !== "0";
// THE 2X RENDER (Jared's pixelation catch: OBS's CEF rasterizes DOM
// cards once at layout size and bitmap-stretches them — big cards go
// blurry; real Chrome re-rasterizes). &ss=2 + an OBS browser source at
// 3840x2160: body zoom doubles every layout raster, JS positions
// compensate (zoom multiplies written px), OBS downscales — cards get
// 2x the pixels at any stretch, the glass gradient renders finer too.
const SS = ROLE === "render" ? (parseFloat(Q.get("ss")) || 1) : 1;

const rItems = {}, rCursors = {};
async function renderLoop() {
  try {
    const st = await (await fetch("/state", { cache: "no-store" })).json();
    const seen = new Set();
    (SHOW_CURSORS ? (st.cursors || []) : []).forEach((c, i) => {
      seen.add(i);
      let rc = rCursors[i];
      if (!rc) {
        const el = document.createElement("div");
        el.className = "cursor";
        el.innerHTML = `<div class="dwell" style="--p:0"></div>`;
        document.body.appendChild(el);
        rc = rCursors[i] = { el, ring: el.querySelector(".dwell"),
                             x: rx(c.x) * innerWidth, y: c.y * innerHeight };
      }
      rc.x += (rx(c.x) * innerWidth - rc.x) * 0.5;
      rc.y += (c.y * innerHeight - rc.y) * 0.5;
      rc.el.style.left = (rc.x / SS) + "px";
      rc.el.style.top = (rc.y / SS) + "px";
      rc.el.classList.toggle("pinched", !!c.p);
      rc.ring.style.setProperty("--p", c.d || 0);
    });
    Object.keys(rCursors).forEach(k => {
      if (!seen.has(+k)) { rCursors[k].el.remove(); delete rCursors[k]; } });

    const ids = new Set();
    (st.items || []).forEach(it => {
      ids.add(it.id);
      let ri = rItems[it.id];
      if (!ri) {
        let el;
        if (it.type === "model") {
          // Build 1: the render page runs its OWN three.js scene per
          // hologram and lerps toward the tracker's rotation
          el = document.createElement("div");
          el.className = "card modelcard" + (it.mm === "holo" ? " holo" : "");
          el.innerHTML = `<canvas></canvas>`;
        } else if (it.type === "widget") {
          el = document.createElement("div");    // THE RING, self-animating
          el.className = "card ringcard";
          el.innerHTML = `<canvas></canvas>`;
        } else if (it.type === "orb") {
          el = document.createElement("div");
          el.className = "card orb";
          el.innerHTML = `<h3>${escT(it.title)}</h3><p>${escT(it.body || "")}</p>`;
        } else if (it.type === "browser") {
          el = document.createElement("div");
          el.className = "panel browser";
          el.innerHTML = `<div class="bar"><h3>${escT(it.title)}</h3></div>` +
                         `<div class="body"><div class="scroll"></div></div>`;
        } else if (it.type === "img") {
          el = document.createElement("div");
          el.className = "card imgcard" + (it.fxf ? " fxcard" : "");
          el.innerHTML = it.vd
            ? `<video src="${escT(it.src)}" autoplay loop muted playsinline></video>`
            : `<img src="${escT(it.src)}" alt="">`;
          el.classList.add("mat");
          setTimeout(() => el.classList.remove("mat"), 650);
        } else if (it.type === "card") {
          el = document.createElement("div");
          el.className = "card";
          el.innerHTML = `<h3>${escT(it.title)}</h3><p>${escT(it.body || "")}</p>`;
        } else {
          el = document.createElement("div");
          el.className = "panel";
          el.innerHTML =
            `<div class="bar"><h3>${escT(it.title)}</h3></div>` +
            `<div class="body"><div class="scroll">loading…</div></div>`;
          fetch("/note?f=" + encodeURIComponent(it.file))
            .then(r => r.ok ? r.text() : "(unavailable)")
            .then(t => { const s = el.querySelector(".scroll");
                         if (s) s.innerHTML = renderNote(t); });
        }
        BEHIND.appendChild(el);
        ri = rItems[it.id] = { el, x: rx(it.x) * innerWidth,
                               y: it.y * innerHeight, s: it.scale || 1,
                               fv: it.fv };   // no flash replay on page load
        if (it.type === "model")
          buildModelScene(el, it.src, it.mm, it.lf).then(sc => { ri.msc = sc; });
        if (it.type === "widget" && it.w === "ring")
          RINGS.set(it.id, ringCanvas(el));   // the ring animates locally
      }
      ri.x += (rx(it.x) * innerWidth - ri.x) * 0.5;
      ri.y += (it.y * innerHeight - ri.y) * 0.5;
      ri.s += ((it.scale || 1) - ri.s) * 0.5;
      ri.el.classList.toggle("grabbed", !!it.g);
      ri.el.style.opacity = it.op == null ? 1 : it.op;
      ri.el.style.setProperty("--ch", it.ch || 0);
      const sc = ri.el.querySelector(".scroll");
      if (sc && it.sy != null) {
        // v20.3: fraction × THIS page's own max-scroll (see pushState);
        // v20.4: lerped like positions — raw 45Hz steps read as jumps
        const rbox = sc.parentElement.clientHeight;
        const rmax = Math.max(0, sc.offsetHeight - rbox + 40);
        ri.sy = (ri.sy || 0) + (it.sy * rmax - (ri.sy || 0)) * 0.5;
        sc.style.transform = `translateY(${-ri.sy}px)`;
      }
      if (it.type === "widget" && it.w === "ring") {
        const rsc = RINGS.get(it.id);
        if (rsc) { rsc.scale = it.scale || 1; rsc.held = !!it.g; }
      }
      if (it.type === "browser" && it.rows && it.rv !== ri.rv) {
        ri.rv = it.rv;
        const bsc = ri.el.querySelector(".scroll");
        if (bsc) bsc.innerHTML = browserRowsHTML(it.rows);
      }
      if (it.type === "browser" && it.fv && it.fv !== ri.fv) {
        ri.fv = it.fv;                 // the tap flash, mirrored on air
        flashRow(ri.el.querySelector(".scroll"), it.fi);
      }
      if (it.type === "model" && ri.msc && ri.msc.group) {
        if (ri.mry == null) { ri.mrx = it.rx || 0; ri.mry = it.ry || 0;
                              ri.mrz = it.rz || 0; }
        ri.mrx += ((it.rx || 0) - ri.mrx) * 0.5;
        ri.mry += ((it.ry || 0) - ri.mry) * 0.5;
        ri.mrz += ((it.rz || 0) - ri.mrz) * 0.5;
        // the mirror law for 3D (Jared's live catch, first show 8/9):
        // positions flip into broadcast space, so orientations must
        // too — yaw and roll negate under the mirror, pitch doesn't.
        // Without this a model facing the presenter on the tracker
        // faced away from them in the overlay.
        ri.msc.group.rotation.x = ri.mrx;
        ri.msc.group.rotation.y = RFLIP ? -ri.mry : ri.mry;
        ri.msc.group.rotation.z = RFLIP ? -ri.mrz : ri.mrz;
        applyExplode(ri.msc, it.ex || 0);   // THE EXPLODE, mirrored
        if (ri.msc.mixer) {
          const mnow = performance.now();
          ri.msc.mixer.update(Math.min((mnow - (ri.msc.mt || mnow)) / 1000, 0.05));
          ri.msc.mt = mnow;
        }
        ensureModelRes(ri.msc, it.scale || 1, !!it.g);
        renderModelScene(ri.msc);
      }
      // GLASS ERA: 3D pose mirrors exactly like models — yaw + roll
      // negate under RFLIP, pitch doesn't; lerped like positions
      if (it.type !== "model") {
        ri.prx = (ri.prx || 0) + ((it.rx || 0) - (ri.prx || 0)) * 0.5;
        ri.pry = (ri.pry || 0) + ((it.ry || 0) - (ri.pry || 0)) * 0.5;
        ri.prz = (ri.prz || 0) + ((it.rz || 0) - (ri.prz || 0)) * 0.5;
      }
      const p3 = it.type !== "model" && (ri.prx || ri.pry || ri.prz)
        ? ` rotateX(${ri.prx}rad) rotateY(${RFLIP ? -ri.pry : ri.pry}rad)` +
          ` rotateZ(${RFLIP ? -ri.prz : ri.prz}rad)`
        : "";
      const w = ri.el.offsetWidth, h = ri.el.offsetHeight;
      // zoom multiplies written px, so positions divide by SS; offsetWidth
      // reports unzoomed layout px, so the centering offset stays as-is
      ri.el.style.transform =
        `translate(${ri.x / SS - w / 2}px, ${ri.y / SS - h / 2}px)` +
        p3 + ` scale(${ri.s})`;
    });
    Object.keys(rItems).forEach(k => {
      if (!ids.has(+k)) {
        if (rItems[k].msc) disposeScene(rItems[k].msc);
        rItems[k].el.remove(); delete rItems[k]; } });
    renderRings();               // the ring draws its own frames
  } catch (e) {}
  requestAnimationFrame(renderLoop);
}

if (ROLE === "render") {
  document.body.classList.add("overlay");
  document.body.classList.add("on-air");
  if (SS > 1) document.body.style.zoom = SS;   // the 2x render raster
  // the html element ALSO paints #000 behind the body — OBS composites
  // whatever the page actually draws (the "still black" bug, 2026-08-07)
  document.documentElement.style.background = "transparent";
  document.body.style.background = "transparent";
  document.getElementById("boot").remove();
  renderLoop();
} else {
  boot().catch(e => {
    document.getElementById("boot").innerHTML =
      `STAGE FAILED TO BOOT<br><span style="color:#ff6666;font-size:13px">${e.message}</span>`;
  });
}
</script>

<div id="jarvisSubtitle" aria-live="polite"></div>

</body>
